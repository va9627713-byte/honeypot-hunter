# Production Docker Compose - Deploy to cloud VM with proper security
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  honeypot:
    build:
      context: .
      args:
        INSTALL_GEOIP: "true"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/run
    volumes:
      - honeypot-logs:/app/logs
      - ./config.prod.yaml:/app/config.yaml:ro
      # Optional: GeoIP database
      # - ./GeoLite2-City.mmdb:/geo/GeoLite2-City.mmdb:ro
      # Optional: SSH host key for consistent identity
      # - ./ssh_host_key:/app/ssh_host_key:ro
    ports:
      # Standard ports - requires root or authbind
      - "22:2222"    # SSH
      - "23:2323"    # Telnet
      - "21:2121"    # FTP
      - "80:8080"    # HTTP
      # Unprivileged alternative (no root needed):
      # - "2222:2222"
      # - "2323:2323"
      # - "2121:2121"
      # - "8080:8080"
      # Other services (always unprivileged):
      - "3306:3306"  # MySQL
      - "6379:6379"  # Redis
      - "2525:2525"  # SMTP
      - "2375:2375"  # Docker API
      - "6443:6443"  # Kubernetes API
      - "1502:1502"  # Modbus
      - "1883:1883"  # MQTT
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Optional: Add capabilities if needed for standard ports
    # cap_add:
    #   - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s = socket.socket(); s.settimeout(2); s.connect(('127.0.0.1', 8080)); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  dashboard:
    build:
      context: .
      args:
        INSTALL_GEOIP: "true"
    command: ["python", "dashboard.py", "--host", "0.0.0.0", "--port", "8765"]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - honeypot-logs:/app/logs:ro
      - ./config.prod.yaml:/app/config.yaml:ro
    ports:
      - "8765:8765"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  # Optional: Ollama for LLM-powered shell responses
  ollama:
    image: ollama/ollama:0.1.46
    profiles: ["llm"]
    restart: unless-stopped
    read_only: false
    volumes:
      - ollama-models:/root/.ollama
    # Optional: Expose Ollama API for model management
    # ports:
    #   - "11434:11434"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '1'
          memory: 2G

  # Optional: Redis for distributed event buffering
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  honeypot-logs:
  ollama-models:
  redis-data:

networks:
  default:
    name: honeypot-prod
    driver: bridge